<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outdoor Activities</title>
  <style>
      * {
        margin: 0 auto;
        padding: 0;
        background-color: #567568;
        color: white;
      }
      h1 {
        font-size: 1em;
        margin: 10px;
      }
      p {
        padding-bottom: 10px;
        font-size: 0.8em;
      }
      img {
        max-width: 100%;
      }
      main {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr;
        gap: 15px;
      }
      .element {
        max-width: 250px;
        display: grid;
        text-align: center;
        padding-top: 10px;
      }
      .image {
        grid-area: 1/1/2/2;
      }
      .maps {
        grid-area: 1/1/2/2;
        opacity: 0;
      }
      .maps:hover {
        opacity: 0.7;
      }
  </style>
</head>
<body>
    <main>
        <section class="element">
          <img src="https://iili.io/qgNuAnR.jpg" class="image">
          <a href="https://sites.google.com/byui.edu/rexburg-guide-hunters/food?authuser=2" class="maps"><img src="https://iili.io/qgNwUkg.png"></a>
          <h1>Food and Treats</h1>
        </section>
        <section class="element">
          <img src="https://iili.io/qNTe2xs.jpg" class="image">
          <a href="https://sites.google.com/byui.edu/rexburg-guide-hunters/indoor-activities?authuser=2" class="maps"><img src="https://iili.io/qgNwUkg.png"></a>
          <h1>Indoor Activities</h1>
        </section>
        <section class="element">
          <img src="https://iili.io/qNTeVLJ.jpg" class="image">
          <a href="https://sites.google.com/byui.edu/rexburg-guide-hunters/outdoor-activities" class="maps"><img src="https://iili.io/qgNwUkg.png"></a>
          <h1>Outdoor Activities</h1>
        </section>
        <section class="element">
          <img src="https://iili.io/qNTeLk7.jpg" class="image">
          <a href="https://sites.google.com/byui.edu/rexburg-guide-hunters/locations" class="maps"><img src="https://iili.io/qgNwUkg.png"></a>
          <h1>Locations near Rexburg</h1>
        </section>
    </main>
</body>
</html>
