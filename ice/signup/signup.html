<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background: rgb(120, 96, 64);
            display: grid;
            grid-template-columns: 1fr 0.75fr 1fr;
        }

        img {
            max-width: 100%;
            height: auto;
        }

        #formContainer {
            grid-column: 2/3;
            margin-top: 1em;
            background: white;
            border: 10px solid #0d2e7c;
            border-radius: 25px;
            overflow: hidden;
        }

        .imgText {
            background-image: url('images/jesus_feeds_5000.jpeg');
            background-repeat: no-repeat;
            background-size: 400px;
            height: 175px;
            align-content: flex-end;
        }

        .imgText button {
            justify-self: flex-start;
            align-self: flex-start;
            margin-bottom: 50px;
            margin-left: 10px;
        }

        .imgText h1 {
            color: white;
            text-align: center;
        }

        .imgText h2 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
        }

        h3 {
            text-align: center;
            margin: 10px;
        }

        #myForm {
            margin: 10px;
            display: grid;
            align-items: center;
        }

        #myForm input {
            grid-column: 2/3;
            margin: 7px;
        }

        #myForm section {
            grid-column: 1/3;
            text-align: center;
            margin: 4px;
        }

        #images {
            display: flex;
            justify-content: space-between;
            gap: 3px;
            margin-bottom: -10px;
        }
    </style>




</head>

<body>
    <div id="formContainer">
        <div class="imgText">
            <button type="button" id="closeBtn">X</button>
            <h1>Daily Feed</h1>
            <h2>Scripture a Day</h2>
        </div>
        <h3>Sign Up for Daily Scripture Feed</h3>
        <form id="myForm">
            <label for="username">User Name:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label>Gender:</label>
            <div>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label>
            </div>

            <section>
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Subscribe to newsletter</label>
            </section>

            <section>
                <input type="checkbox" id="conditions" name="conditions" required>
                <label for="conditions">I acknowledge the terms and conditions</label>
            </section>

            <section>
                <button type="submit">Submit</button>
            </section>
        </form>
        <section id="images">
            <a href="https://www.churchofjesuschrist.org/study/scriptures/ot?lang=eng" target="_blank"><img src="images/old_testament.webp" alt="Old Testament"></a>
            <a href="https://www.churchofjesuschrist.org/study/scriptures/nt?lang=eng" target="_blank"><img src="images/new_testament.webp" alt="New Testament"></a>
            <a href="https://www.churchofjesuschrist.org/study/scriptures/bofm?lang=eng" target="_blank"><img src="images/book_of_mormon.webp" alt="Book of Mormon"></a>
            <a href="https://www.churchofjesuschrist.org/study/scriptures/dc-testament?lang=eng" target="_blank"><img src="images/doctrine_and_covenants.webp" alt="Doctrine and Covenants"></a>
            <a href="https://www.churchofjesuschrist.org/study/scriptures/pgp?lang=eng" target="_blank"><img src="images/pearl_of_great_price.webp" alt="Pearl of Great Price"></a>
        </section>
    </div>

    <div id="output"></div>

    <script>
        // Here is some Javascript to start looking forward to wdd131
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
         });
        const form = document.getElementById('myForm');
        const output = document.getElementById('output');

        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Stop form from actually submitting

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
            <br>  
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
                });
    </script>

</body>

</html>
