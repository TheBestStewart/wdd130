<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russell M. Nelson</title>
    <style>
        /* Insert styles here, this is called an internal stylesheet  */
        img {
            max-width: 100%;
            border: 3px solid #FFFFFE;
        }
        body {
            background: #FFECD7;
        }
        main {
            display: grid;
            grid-template-columns: 1fr 0.60fr 1fr;
        }
        section#card {
            grid-area: 1/2/2/3;
            background-color: #008DB1;
            text-align: center;
            margin: 0 auto;
            border: 3px solid #004E63;
            border-radius: 20px;
            margin-top: 20px;
        }
        section#card h1 {
            color: #FFFFFE;
            font-family: Helvetica, sans-serif;
            margin: 10px;
            font-size: 1.75em;
        }
        section#card h2 {
            color: #91E4FB;
            font-family: Helvetica, sans-serif;
            font-size: 0.8em;
            margin-left: 10px;
            margin-right: 10px;
        }
        section#card a {
            text-decoration: none;
        }
        section#card img {
            width: 200px;
        }
        section#card ul {
            color: #FFFFFE;
            font-family: Helvetica, sans-serif;
            text-align: left;
            margin: 0;
            margin-left: 30px;
        }
        section#card blockquote {
            color: #FFD783;
            font-family: 'Brush Script MT', cursive;
        }
    </style>
</head>
<body>
    <main>
        <section id="card">
            <h1>Russel M. Nelson</h1>
            <a href="churchofjesuschrist.org"><h2>17th President of the Church of Jesus Christ of Latter-day Saints</h2></a>
            <img src="images/russell_nelson.png" alt="Picture of President Nelson">
            <ul>
                <li>Born: Sep 9, 1924</li>
                <li>Apostle: Apr 7, 1984</li>
                <li>Prophet: Jan 14, 2018</li>
            </ul>
            <blockquote>
                "I urge you to devote time each week — for the rest of your life — to increase your understanding of the Atonement of Jesus Christ."
            </blockquote>
        </section>
    </main>
</body>
</html>
