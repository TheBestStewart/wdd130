<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    <main>
      <div class="content-box">
        <table>
          <tr>
            <th>Speaker</th>
            <th>Title</th>
            <th>Location</th>
            <th>Year</th>
          </tr>
          <tr>
            <td>Elder Kim B. Clark</td>
            <td>In the Hands of the Lord</td>
            <td>BYU-Idaho Center</td>
            <td>2025</td>
          </tr>
          <tr>
            <td>President Alvin F. Meredith III</td>
            <td>Go and Do Thou Likewise</td>
            <td>BYU-Idaho Center</td>
            <td>2026</td>
          </tr>
          <tr>
            <td>Heidi Egan</td>
            <td>Hearts Knit Together in Song</td>
            <td>BYU-Idaho Center</td>
            <td>2025</td>
          </tr>
        </table>
        <section id="form">
          <label>
            Speaker <input type="text" id="speaker">
          </label>
          <label>
            Title <input type="text" id="title">
          </label>
          <label>
            Location <input type="text" id="location">
          </label>
          <label>
            Year <input type="text" id="year">
          </label>
          <button>Push Changes</button>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
