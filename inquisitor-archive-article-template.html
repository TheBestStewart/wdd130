        }
        #leftarrow {

            left: 0;
            font-size: 4em;
            padding: 5px;
            opacity: 0.5;
        }
        #rightarrow {
            position: fixed;
            right: 0;
            font-size: 4em;
            padding: 5px;
            opacity: 0.5;
        }
        footer {
            position: fixed;
            bottom: 0;
            height: 50px;
            width: 100%;
            background-color: beige;
            text-align: center;
        }
        main {
            padding-left: 50px;

        }
    </style>

    <button type="button" class="collapsible">Newspaper Clipping</button>
    <div class="content"><img class="newspaper-clipping" src="#" alt="Newspaper Clipping"></div>
    </main>
    <script>
        var coll = document.getElementsByClassName("collapsible");
        var i;
            
        for (i = 0; i < coll.length; i++) {
          coll[i].addEventListener("click", function() {
            this.classList.toggle("active");
            var content = this.nextElementSibling;
            if (content.style.display === "block") {
              content.style.display = "none";
            } else {
              content.style.display = "block";
            }
          });
        } 
    </script>
